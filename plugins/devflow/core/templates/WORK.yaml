      forbidden: [unrelated-refactoring]
    requirements: []

    # Step one of execution: confirm each of these at current HEAD before editing.
    # If one is false, the premise moved and this is a stop condition, not a puzzle to solve.
    premise_checks:
      - "Name a specific method, condition, or migration number to look at, and what you expect to find."

    verification:
      commands: []
    acceptance: []

    # Known failure modes for this change. Each entry says what breaks and what it costs.
    pitfalls:
      - "Name the mistake an executor is likely to make here and the symptom it produces."

    stop_conditions:
      - Current code invalidates a material task premise.
      - The change requires scope outside the approved PRD or PLAN.
      - A product/policy decision is required.
    references: []
    risk:
      level: medium
      axes: []
    status: ready
    block_reason: null
    evidence:
      commit: null
      changed_files: []
      commands: []
      deviations: []
      discoveries: []

