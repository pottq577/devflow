# Existing STATE files without plan_review.audit_file read this same default at runtime.

# Phase keys are zero-padded two-digit strings. The runtime normalizes on read, but two raw
# keys that normalize to the same phase ("5" and "05") are a validation error, because the
# duplicate silently splits one phase into two state rows.
