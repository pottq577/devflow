version: 1
profiles:
  economy:
    candidates: [fast, balanced]
  balanced:
    candidates: [balanced, frontier]
  alternative:
    candidates: [balanced]
  frontier:
    candidates: [frontier]
  hardest:
    candidates: [frontier]
profile_order: [economy, balanced, alternative, frontier, hardest]
roles:
  scout: { profile: balanced, effort: medium, sandbox: read-only }
  architect: { profile: frontier, effort: high, sandbox: workspace-write }
  worker: { profile: economy, effort: high, sandbox: workspace-write }
  verifier: { profile: frontier, effort: high, sandbox: workspace-write }
  auditor: { profile: frontier, effort: high, sandbox: workspace-write }
  integration_auditor:
    { profile: hardest, effort: xhigh, sandbox: workspace-write }
  diagnostician: { profile: frontier, effort: xhigh, sandbox: read-only }
  finalizer: { profile: frontier, effort: high, sandbox: workspace-write }
escalation:
  kind:
    documentation:
      worker_profile: economy
      worker_effort: high
    test:
      worker_profile: economy
      worker_effort: high
    implementation:
      worker_profile: economy
      worker_effort: high
    evidence:
      worker_profile: economy
      worker_effort: high
    remediation:
      worker_profile: economy
      worker_effort: xhigh
    migration:
      worker_profile: economy
      worker_effort: xhigh
  risk:
    high:
      architect_profile: frontier
      architect_effort: xhigh
      worker_profile: economy
      worker_effort: xhigh
      scout_effort: high
      verifier_profile: frontier
      verifier_effort: xhigh
      auditor_profile: frontier
      auditor_effort: xhigh
      finalizer_profile: frontier
      finalizer_effort: xhigh
    critical:
      architect_profile: hardest
      architect_effort: xhigh
      worker_profile: economy
      worker_effort: max
      scout_effort: high
      verifier_profile: hardest
      verifier_effort: xhigh
      auditor_profile: hardest
      auditor_effort: xhigh
      integration_auditor_profile: hardest
      integration_auditor_effort: xhigh
      finalizer_profile: hardest
      finalizer_effort: xhigh
  retries:
    worker_stages:
      - { attempt: 1, profile: economy, effort: xhigh }
      - { attempt: 2, profile: economy, effort: max }
      - { attempt: 4, profile: economy, effort: max }
      - { attempt: 5, profile: alternative, effort: xhigh, replace: true }
    diagnose_at: 3
    max_no_progress: 5
delegation:
  recursive: false
context:
  default_mode: capsule
  native_fork_turns: none
concurrency:
  mutating: 1
  read_only: 2
orchestration:
  scout_before: [architect, verifier, auditor, integration_auditor, diagnostician, finalizer]
  scout_max_chars: 12000
budget:
  total_tokens: 1000000
  planning_percent: 15
  implementation_percent: 45
  verification_percent: 20
  finalization_percent: 10
  reserve_percent: 10
  dispatch_reserve_tokens: 25000
  scout_reserve_tokens: 8000
backends:
  preference: [native_agent, codex_exec]
