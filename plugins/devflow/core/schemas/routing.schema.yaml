version: 1
required: [version, profiles, roles, escalation, context, concurrency, orchestration, budget, backends]
notes:
  - Routing policy is runtime configuration, never PLAN/WORK authority.
  - Profiles bind logical capability tiers to model aliases from the model registry.
  - Concrete model IDs and capabilities live in core/routing/models.yaml, not in routing policy.
  - Project routing overrides live in .devflow/routing.yaml; model registry overrides live in .devflow/models.yaml.
  - profile_order ranks capability tiers for retry promotion; retries never downgrade an already stronger risk-selected profile.
  - escalation.kind applies role-specific task-kind overrides before risk overrides.
  - escalation.risk treats domain risk as a floor and may promote a WORK above that floor through next_action.item_risk.
  - escalation.retries may promote a stalled worker to stronger profiles and effort without changing lifecycle authority.
  - Dispatcher capabilities choose execution backend after a model alias resolves to a concrete model.
  - Budget total_tokens is a measured-usage pre-dispatch guard; percentage buckets may borrow only from reserve.
  - dispatch_reserve_tokens and scout_reserve_tokens must fit before a new dispatch starts; one in-flight backend run may report usage above its reservation.
  - orchestration.scout_before names specialist roles that receive one persisted read-only scout digest per action.
  - concurrency.mutating is enforced with cross-process domain leases.
