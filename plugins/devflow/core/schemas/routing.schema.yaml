version: 1
required: [version, profiles, roles, escalation, context, concurrency, orchestration, budget, backends]
load_bearing_optional:
  profile_order: >
    Ranked capability tiers for retry promotion. Absent, the runtime falls back to the profiles
    mapping key order. RoutingController._stronger_profile() reads it, so a policy that omits it
    silently changes retry promotion.
  delegation.recursive: >
    Whether a dispatched specialist may recursively delegate. Absent, delegation is refused.
    RoutingController reads it before backend selection, so an override that drops the key disables
    recursive delegation for the whole project.
notes:
  - Routing policy is runtime configuration, never PLAN/WORK authority.
  - Profiles bind logical capability tiers to model aliases from the model registry.
  - Concrete model IDs and capabilities live in core/routing/models.yaml, not in routing policy.
  - Project routing overrides live in .devflow/routing.yaml; model registry overrides live in .devflow/models.yaml.
  - profile_order ranks capability tiers for retry promotion; retries never downgrade an already stronger risk-selected profile unless a stage explicitly sets replace: true for a cross-family fallback.
  - escalation.kind applies role-specific task-kind overrides before risk overrides.
  - escalation.risk uses explicit action/WORK risk for worker and work-verifier routing when present; other roles retain domain risk as a floor, and item-scoped roles fall back to domain risk when no explicit risk is declared.
  - escalation.retries.worker_stages is an ordered retry ladder keyed by minimum attempt; legacy retry fields remain readable; a project override using them replaces the bundled staged retry defaults.
  - Retry stages normally respect profile/effort floors; replace: true explicitly switches to an alternative model family after diagnosis.
  - Dispatcher capabilities choose execution backend after a model alias resolves to a concrete model.
  - roles.permissions uses inherit for the caller's Codex permission profile and read-only for an explicit :read-only override; legacy sandbox keys remain readable for project overrides.
  - Timeout retries are separate from semantic no-progress retries: timeout_diagnose_at schedules diagnosis without incrementing the no-progress attempt, and max_consecutive_timeouts blocks repeated timeouts for one action.
  - Budget total_tokens is a measured-usage pre-dispatch guard; percentage buckets may borrow only from reserve.
  - dispatch_reserve_tokens and scout_reserve_tokens must fit before a new dispatch starts; one in-flight backend run may report usage above its reservation.
  - orchestration.scout_before names Sol decision roles that receive one persisted Terra pre-analysis capsule per action when budget permits.
  - A successful scout capsule replaces the full rendered runtime packet for Sol decision dispatches; the specialist can re-render on demand when evidence is missing or ambiguous.
  - orchestration.scout_max_chars bounds the persisted/passed pre-analysis capsule; failed or same-model scouts fall back to the full runtime packet.
  - concurrency.mutating is enforced with cross-process domain leases.
