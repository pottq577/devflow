schema: devflow-work-v2
version:
  current: 2
  supported: [1, 2]
required_item_fields:
  - id
  - kind
  - origin
  - objective
  - dependencies
  - decision_dependencies
  - scope
  - requirements
  - verification
  - acceptance
  - stop_conditions
  - risk
  - status
  - evidence
optional_item_fields:
  title: Short human label for the item. Carried in the WORK template and read for status reporting context; it never selects work.
  origin.aggregation_reason: Required nonblank rationale when origin.findings contains two or more ids.
  context: Repository facts the Architect already verified, so the Executor does not re-derive them. Expected for high and critical risk.
  premise_checks: Facts to re-confirm at current HEAD before editing anything. Mandatory for high and critical risk.
  pitfalls: Known failure modes for this specific change. Each entry names what breaks and why.
  blocks: WORK ids that depend on this one. Informational mirror of their dependencies.
  transfer: Where a transferred requirement went, as {to, requirements}. Mandatory when status is transferred.
  references: External document ids or paths the Executor should read.
  review: Optional work-level review metadata, as {required, status, audit_file, remediation_work_ids, audit_provenance}. review.audit_provenance is machine-owned closure provenance. Its findings mapping is read by the next work closure; optional applied_against records the prior findings used to validate the persisted closure audit. Runtime defaults preserve legacy WORK files.
  block_kind: Optional blocked-state discriminator. execution is a real execution blocker; external is an evidence/access wait. Missing legacy values read as execution.
  block_resume_status: Ready or in_progress status to restore through work unblock or work resume.
  block_reason: Free-text reason recorded by work block or work wait-external. The runtime falls back to it when rendering the provide-evidence handoff reason.
  risk.axes: Optional audit axes this item is expected to be reviewed against. Author intent for the Auditor; it is not a review gate and validate does not read it.
  evidence.commit: Source commit recorded by work done. Ordinary completion evidence.
  evidence.changed_files: Paths recorded by work done through --changed-file. Reported evidence; validate does not require it to match the commit diff.
  evidence.deviations: Deviations from scope recorded through --deviation.
  evidence.discoveries: Findings surfaced during execution recorded through --discovery.
  transition_history: Ordered explicit block/wait/recovery transitions with from, to, reason, and timestamp.
  evidence.external_wait: External evidence provenance as {status, reason, checked_at, missing_evidence, resolved_at, resolution}. status is unverified while waiting and resolved after work resume.
  evidence.mitigation: Optional risk-mitigation linkage as {status, work_ids}. status is pending or verified; verified references must point to done WORK whose required review is satisfied.
  evidence.residual_risks: Optional list of remaining risks as {id, status, blocks}. status is unknown, open, or resolved; unknown/open entries name the lifecycle targets they still block.
backward_compatibility:
  legacy_shape: Version 1 acceptance and verification.commands remain string lists and are not rewritten.
  legacy_review: Existing WORK without review remains readable; high/critical done WORK defaults to pending required review.
  legacy_audit_provenance: WORK without review.audit_provenance stays readable. Existing records with only findings validate the persisted audit against that mapping. The field is required only when a work closure audit is applied or validated; blocked reviews and legacy remediation reviews without provenance clear stale remediation_work_ids and re-run the initial audit after 'devflow work review <domain> <ID> pending'.
  migration: No migration command is required; runtime normalization preserves readability.
version_2:
  acceptance:
    required_fields: [id, criterion]
    unique: id
    nonblank: [id, criterion]
  verification_command:
    required_fields: [id, command, covers]
    unique: id
    nonblank: [id, command]
    covers: Every command covers at least one existing acceptance id, and every acceptance id is covered.
finding_traceability:
  required_for_kinds: [remediation, evidence, documentation]
  aggregation_reason_required_when_findings_at_least: 2
kind:
  allowed:
    [implementation, remediation, evidence, documentation, migration, test]
status:
  allowed: [ready, in_progress, done, blocked, transferred, cancelled]
terminal: [done, transferred, cancelled]
risk_level:
  allowed: [low, medium, high, critical]
review_status:
  allowed: [skipped, pending, remediation, blocked, verified]
enforced_by_validate:
  - remediation, evidence, and documentation require nonempty origin.findings
  - multiple origin.findings require a nonblank origin.aggregation_reason
  - version 1 acceptance and verification.commands must not be empty
  - version 2 acceptance ids and verification command ids are unique and nonblank
  - version 2 acceptance criteria and verification commands are nonblank
  - version 2 verification coverage is complete and references only existing acceptance ids
  - version 2 rejects version 1 string entries
  - dependencies must resolve, and the dependency graph must be acyclic
  - a ready item must not depend on an unresolved decision
  - high and critical risk require premise_checks
  - done requires evidence.commands, except for kind documentation
  - transferred requires transfer.to, and the target must carry the same origin.requirements
  - explicit review metadata must use a supported status and valid remediation WORK ids
  - evidence may be null for backward readability; otherwise it must be a mapping. evidence.delivery may be null before work start and is normalized to a mapping when delivery is active
  - blocked WORK may use block_kind execution or external; missing legacy block_kind means execution
  - external blocks require unverified evidence.external_wait with a reason, checked_at, and nonempty missing_evidence
  - resolved external waits retain resolution provenance after work resume
  - transition_history entries use supported WORK statuses and nonblank reason/timestamp values
  - evidence.mitigation uses pending or verified status and references existing WORK; verified mitigation references must be done and review-satisfied
  - evidence.residual_risks entries have unique nonblank ids, supported statuses, and nonblank block targets while unknown or open

delivery_evidence:
  enabled_when: STATE.delivery.version equals 1 and WORK is not grandfathered.
  start_sha: Machine-owned immutable source commit captured by work start; ancestor of completion commit.
  comments:
    type: list
    entry_fields: [path, line, reason]
    path: Canonical repository-relative changed executable source path.
    line: Positive integer identifying a substantive comment/docstring in the recorded source commit.
    reason: Nonblank intent/invariant/constraint explanation; usefulness is audited.
  comments_note: Concrete exception rationale required for docs/config/deletion-only changes.
  delivery:
    machine_fields: [branch, branch_start_sha]
    branch: Target delivery branch captured by work start. Detached worktrees infer a unique sibling checkout or require --branch.
    executor_fields: [base_ref, pr_file, postman_file, api_endpoints, api_note]
    optional_executor_fields: [base_sha]
    recorded_fields:
      [
        branch,
        checkout_mode,
        branch_start_sha,
        base_ref,
        base_sha,
        head_sha,
        pr_file,
        postman_file,
        template_sha256,
        pr_sha256,
        postman_sha256,
        work_ids,
        api_endpoints,
        api_note,
      ]
    checkout_mode: attached or detached source checkout recorded at completion.
    branch_start_sha: Detached-only target-branch tip captured before isolated source commits; later validation preserves this lower bound.
    api_endpoints: Cumulative branch METHOD /path coverage; empty for a verified no-HTTP change.
    api_note: Nonblank coverage/exception assessment.
  complete: Current source HEAD, captured delivery branch, clean executable source, comment evidence and both derived artifacts validated atomically.

newman_remediation:
  applies_to: Protocol 1.8 finalization code/collection diagnosis.
  phase: integration
  kind: remediation
  origin_findings: Contains NEWMAN-<failed-run-id>.
  references: Contains the sanitized failing Newman summary path.
  evidence: Ordinary verified source/test commit, regression commands, comment and branch delivery evidence.
  isolation: Only registered scope.allowed files; private generated docs remain local.
