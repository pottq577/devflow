schema: devflow-state-v1
required:
  - protocol_version
  - domain
  - risk_profile
  - project_status
  - baseline_sha
  - phases
  - integration
  - unresolved_decisions
  - next_action
optional:
  workflow_type: Workflow type, one of delivery or audit_remediation. Missing legacy values read as delivery.
  extension: Name of the audit extension to load. Resolved from .devflow/extensions/<name>.md first, then the plugin's core/extensions/<name>.md, then default.
  plan_review:
    required: Whether plan review must be verified before WORK begins.
    status: Plan review status, one of pending, remediation, blocked, verified, or skipped.
    audit_file: Plan audit artifact path. Defaults to audits/plan.md for legacy STATE.
    remediation_work_ids: WORK IDs linked by a plan audit. Optional for legacy STATE.
    audit_provenance: Machine-owned closure provenance. Its findings mapping is the next closure basis; optional applied_against preserves the prior basis used by the persisted closure audit. Written by 'devflow audit apply' on every applied plan audit. Optional; required only at closure.
  phase_entry.audit_provenance: Machine-owned closure provenance for the phase. Its findings mapping is the next closure basis; optional applied_against preserves the prior basis used by the persisted closure audit. Written by 'devflow audit apply' on every applied phase audit. Optional; required only at closure.
  integration.audit_provenance: Machine-owned closure provenance for integration. Its findings mapping is the next closure basis; optional applied_against preserves the prior basis used by the persisted closure audit. Written by 'devflow audit apply' on every applied integration audit. Optional; required only at closure.
backward_compatibility:
  legacy_workflow_type: Existing STATE without workflow_type reads as delivery without a migration write.
  legacy_plan_review_audit_file: Existing plan_review without audit_file reads as audits/plan.md.
  legacy_plan_review_remediation: Existing pending plan_review with remediation_work_ids keeps the remediation gate.
  legacy_audit_provenance: STATE without audit_provenance stays readable. Existing records with only findings validate the persisted audit against that mapping. The field is required only when a plan, phase, or integration closure audit is applied or validated. A protocol 1.3.0 plan that is mid-closure uses plan-review set pending, which clears stale remediation_work_ids before the initial audit is re-run.
  migration: No migration command is required; runtime normalization preserves readability.
protocol_compatibility:
  runtime_config: .devflow/config.yaml protocol_version is checked before artifact mutation.
  malformed_or_different_major: Validation error.
  newer_same_major: Read-only status and validate are allowed with a warning; artifact mutation is blocked.
  older_same_major: Backward-compatible read is allowed.
  new_state: New init records the current runtime protocol version in config and STATE.
  config_is_a_floor: When .devflow/config.yaml exists, its protocol_version is a floor. The audit-apply gate decides from the higher of the STATE and config versions, so hand-editing STATE.protocol_version below the config cannot re-enable a legacy verified transition. validate reports an error when STATE declares a protocol older than the config. A project with no config file, or whose config genuinely records the older version, keeps the legacy path.
workflow_type:
  allowed: [delivery, audit_remediation]
project_status:
  allowed: [planning, plan_review, phase_execution, work_audit, phase_audit, remediation, integration_audit, integration_remediation, integration_closure, delivery_finalization, complete, blocked]
phase_status:
  allowed: [planned, executing, audit, remediation, verified, blocked]
integration_status:
  allowed: [pending, audit, remediation, closure, blocked, verified]
plan_review_status:
  allowed: [pending, remediation, blocked, verified, skipped]
plan_review:
  required: [required, status]
  optional: [audit_file, remediation_work_ids]
  remediation_work_ids:
    type: list
    items: {type: string}
phase_entry:
  required: [status, work_file, audit_file]
  optional:
    base_ref: Branch or ref the phase started from.
    head_ref: Branch or ref holding the phase's work.
    base_sha: Immutable commit the diff starts at.
    head_sha: Immutable commit the diff ends at.
    diff_range: The auditable range. Written by 'devflow phase ref', which refuses a 3-dot range when base is not an ancestor of head.
    audit_provenance: Machine-owned closure provenance. Its findings mapping is read by the next closure; optional applied_against records the prior findings used to validate the persisted closure audit.
  key_format: >
    Zero-padded two-digit strings ("01", "05"). The runtime normalizes on read, so "5" also resolves,
    but validate reports two raw keys that normalize to the same phase as an error.

delivery:
  optional_for_legacy: true
  enabled_for_new_domains: true
  required_fields: [version, grandfathered_work_ids, branches]
  version: 1
  grandfathered_work_ids: Unique ids of already-done WORK snapshotted once by delivery enable.
  branches:
    key: Exact source branch name.
    required_fields: [base_ref, base_sha, head_sha, pr_file, postman_file, template_sha256, pr_sha256, postman_sha256, work_ids, api_endpoints, api_note]
    full_source_shas: [base_sha, head_sha]
    content_hashes: [template_sha256, pr_sha256, postman_sha256]
    work_ids: Unique ordered ids; exactly the delivered done WORK on this branch, latest commit equals head_sha.
    final_gate: Extant local branch tips must equal recorded head_sha at integration verification.
  migration: delivery enable preserves PLAN/WORK bytes and upgrades only the domain STATE protocol; future ready/in-progress WORK obeys the new gate.
  provenance: Branch artifacts are local files; Git history of documentation is optional.

delivery_finalization:
  path: delivery.finalization
  optional_for_legacy: true
  version: 1
  required_fields: [version, runs, diagnoses, explanation]
  optional_fields: [receipt]
  runs:
    type: list
    immutable_attempt_ids: true
    required_fields: [id, branch, source_sha, collection_sha256, recorded_at, exit_code, status, counts, reason_codes, server_sha, newman_version, raw_file, raw_sha256, summary_file, summary_sha256]
    status: [passed, failed, blocked, not_applicable]
    counts: [expected_requests, requests, request_failures, assertions, assertion_failures, skipped_assertions]
    private_evidence: Raw report stays local through closure; content hash must match when present.
  diagnoses:
    key: Existing unsuccessful run id.
    required_fields: [classification, reason, work_id]
    classification: [code, collection, environment, unknown]
    work_id: Required traced integration remediation for code/collection; null for environment/unknown.
  explanation:
    nullable: true
    required_fields: [html_file, html_sha256, scope_sha256, skill_name, skill_file, skill_sha256, invocation]
    skill_name: eli5
    scope: All domain source documents, WORK, branch records, Newman attempts and diagnoses.
  receipt:
    required_fields: [scope_sha256, html_sha256]
    invalidation: Scope or artifact changes require refreshed ELI5/Newman evidence and delivery finalize.
  commands: [delivery context, delivery explain, delivery newman, delivery triage, delivery finalize]
  failure_persistence: Newman nonzero exits preserve actual attempt evidence; lifecycle refusals stay atomic.
