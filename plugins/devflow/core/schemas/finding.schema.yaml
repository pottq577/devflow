schema: devflow-finding-v1
type: mapping
required:
  - id
  - classification
  - severity
  - severity_reason
  - axis
  - expected
  - actual
  - evidence
  - root_cause
  - disposition
properties:
  id: {type: string}
  classification:
    type: string
    allowed: [CONFIRMED, DECISION_REQUIRED, EVIDENCE_REQUIRED, REJECTED, DOCUMENTATION_DRIFT, SPEC_DRIFT]
  severity:
    type: string
    allowed: [blocker, major, minor, nit]
  severity_reason: {type: string}
  axis: {type: string}
  expected: {type: string}
  actual: {type: string}
  evidence:
    type: list
    min_items: 1
    items: {type: string}
  root_cause: {type: string}
  disposition:
    type: mapping
    required: [action, work_ids, decision_ids]
    properties:
      action:
        type: string
        allowed: [remediation_work, evidence_work, documentation_work, decision, record_only, stop]
      work_ids:
        type: list
        items: {type: string}
      decision_ids:
        type: list
        items: {type: string}
classification:
  allowed: [CONFIRMED, DECISION_REQUIRED, EVIDENCE_REQUIRED, REJECTED, DOCUMENTATION_DRIFT, SPEC_DRIFT]
  disposition:
    CONFIRMED: create remediation WORK
    DECISION_REQUIRED: record the decision, block dependent WORK, create no code change
    EVIDENCE_REQUIRED: create evidence WORK, never product-code changes
    REJECTED: keep the audit record only
    DOCUMENTATION_DRIFT: create documentation WORK
    SPEC_DRIFT: stop affected execution until the conflict is resolved
severity:
  allowed: [blocker, major, minor, nit]
  meaning:
    blocker: Shipping this corrupts data or gets money wrong. Fix before any dependent work starts.
    major: Violates an approved specification or a repository-enforced rule. Fix inside this phase.
    minor: Behavior is correct but carries maintenance risk. May travel to the next phase.
    nit: Taste and readability. Closing it is optional.
