schema: devflow-audit-v1
type: mapping
contract:
  required_allowed:
    - properties.scope
    - properties.mode
    - properties.verdict
    - properties.closure.items.properties.outcome
  references: [finding]
  rubric: verdict
required:
  [
    schema,
    scope,
    mode,
    verdict,
    baseline_sha,
    target_sha,
    verification,
    findings,
  ]
optional:
  phase: Phase key this audit covers. Required in effect for a phase-scoped audit and absent for project-level scopes. The runtime normalizes the key on read, so "1" and "01" both resolve, and validates it against the lifecycle phase that the audit is being applied to.
  task: WORK id this audit covers. Required in effect for a work-scoped audit and validated against the lifecycle WORK item that the audit is being applied to.
  enforcement: Both keys stay optional in the schema because a phase or task is not representable as a required string for every scope. When either key is present, devflow.py audit_artifact_contract_errors() rejects a mismatch instead of ignoring it.
properties:
  schema:
    type: string
    const: devflow-audit-v1
  scope:
    type: string
    allowed: [plan, work, phase, integration]
  mode:
    type: string
    allowed: [initial, closure]
  verdict:
    type: string
    allowed: [pass, conditional_pass, fail]
  baseline_sha:
    type: string
  target_sha:
    type: string
  diff_range:
    type: string
  verification:
    type: list
    min_items: 1
    items:
      type: mapping
      required: [command, result]
      properties:
        command: { type: string }
        result: { type: string }
  findings:
    type: list
    items: { $ref: finding }
  closure:
    type: list
    items:
      type: mapping
      required: [finding_id, outcome, evidence, reopened_as]
      properties:
        finding_id: { type: string }
        outcome:
          type: string
          allowed: [resolved, still_open, reopened, accepted_risk]
        evidence:
          type: list
          min_items: 1
          items: { type: string }
        reopened_as:
          type: list
          items: { type: string }
verdict:
  pass:
    forbidden_severities: [blocker, major]
  conditional_pass:
    required_severities: [major]
    forbidden_severities: [blocker]
  fail:
    required_severities: [blocker]
